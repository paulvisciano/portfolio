<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jailbreak Your Laptop — Cover</title>
<style>
@font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 300 600; font-display: swap; src: url(../fonts/fraunces-latin.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 600; font-display: swap; src: url(../fonts/inter-latin.woff2) format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(../fonts/jetbrains-mono-latin-400.woff2) format('woff2'); }
:root {
  --bg: oklch(8% 0.002 260);
  --fg: oklch(96% 0.002 260);
  --fg-bright: oklch(99% 0 0);
  --muted: oklch(58% 0.004 260);
  --faint: oklch(60% 0.003 260);
  --border: oklch(28% 0.003 260);
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute; inset: -40%;
  background:
    radial-gradient(circle at 30% 40%, oklch(16% 0.015 260 / 0.5), transparent 50%),
    radial-gradient(circle at 70% 60%, oklch(14% 0.01 280 / 0.4), transparent 50%);
  pointer-events: none;
}
.logo {
  position: absolute; top: 28px; left: 32px;
  font-family: var(--font-display); font-size: 14px; font-weight: 400;
  letter-spacing: 0.02em; color: var(--faint);
}
.mark {
  position: absolute; top: 28px; right: 32px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint);
}
.cover {
  position: relative; z-index: 1;
  text-align: center;
  padding: 48px 32px;
  max-width: 920px;
}
.eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 20px;
}
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(48px, 8vw, 88px);
  line-height: 1; letter-spacing: -0.03em;
  color: var(--fg-bright);
}
.rule {
  width: 48px; height: 1px; background: var(--border);
  margin: 22px auto;
  border: 0;
}
.lead {
  font-family: var(--font-display); font-weight: 300;
  font-size: 17px; line-height: 1.65;
  color: var(--muted); max-width: 42ch; margin: 0 auto 36px;
  letter-spacing: -0.005em;
}
.cta {
  font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg);
}
.parts {
  margin-top: 56px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
}
.foot {
  position: absolute; bottom: 28px; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint);
}
</style>
</head>
<body>
  <div class="logo">pv</div>
  <div class="mark">Sci-Fi Labs</div>
  <div class="cover">
    <p class="eyebrow">A five-part series</p>
    <h1>Jailbreak Your Laptop</h1>
    <hr class="rule">
    <p class="lead">Own the OS. Own the apps. Own the stack. The road to a computer that is actually yours.</p>
    <p class="cta">Recipe for sovereignty</p>
    <div class="parts">
      <span>01 Jailbreak</span>
      <span>02 Local AI</span>
      <span>03 Your apps</span>
      <span>04 Public layer</span>
      <span>05 Reclaim data</span>
    </div>
  </div>
  <div class="foot">Paul Visciano · paulvisciano.com</div>
</body>
</html>
